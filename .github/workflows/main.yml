name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master and develop branches
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Verify generated serialization files
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/src/messages

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate package publishing
        run: flutter pub publish --dry-run

  # Build Android example
  android_example_build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: flutter build apk --debug
        working-directory: ./example

  # Build iOS example
  ios_example_build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: flutter build ios --no-codesign --debug
        working-directory: ./example

  # Build macOS example
  macos_example_build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: flutter build macos --debug
        working-directory: ./example

  # Build Linux example
  linux_example_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: |
          sudo apt-get update
          sudo apt-get install ninja-build libgtk-3-dev
          flutter build linux --debug
        working-directory: ./example

  # Web WASM build
  wasm_example_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: flutter build web --wasm
        working-directory: ./example

  # Web JavaScript build
  js_example_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./example

      - run: flutter build web
        working-directory: ./example
